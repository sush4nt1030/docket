plugins {
    id 'com.android.application'
}

android {
    namespace 'app.docket.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.docket.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Optional stable signing key (lets you install updates over an existing install).
    // Provide it through environment variables; without them the APK is signed with the debug key.
    def ks = System.getenv('DOCKET_KEYSTORE')
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DOCKET_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DOCKET_KEY_ALIAS') ?: 'docket'
                keyPassword System.getenv('DOCKET_KEY_PASSWORD') ?: System.getenv('DOCKET_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party libraries: the app only uses the Android framework.
dependencies {
}
